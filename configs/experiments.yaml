# NNDL Saliency experiment configuration.

training:
  train_split: "train"
  validation_split: "tuning"

  batch_size: 8
  epochs: 30
  num_workers: 0

  early_stopping:
    enabled: true
    patience: 5

  # Shared rule for selecting the best checkpoint on the tuning split.
  # Higher CC is better.
  selection_metric: "cc"
  selection_mode: "max"

  optimizer:
    name: "AdamW"
    learning_rate: 1.0e-4
    weight_decay: 1.0e-4


experiments:

  B0:
    # Isolates the center-bias baseline.
    model: "center_prior"
    trainable: false

    # B0 is computed from training-set probability maps.
    target: "density_map_prob"

    loss:
      name: null


  B1:
    # Reference neural baseline.
    model: "B1Baseline"

    encoder:
      name: "ResNet18"
      pretrained: true

    decoder:
      name: "single_bottleneck"
      width: 96

    # Compute MSE on the raw density map in [0, 1].
    target: "density_map_raw"

    loss:
      name: "mse"


  M1:
    # Isolates the effect of skip connections / multi-scale features
    # while keeping the same loss as B1.
    model: "multiscale_resnet18"

    encoder:
      name: "ResNet18"
      pretrained: true

    features:
      - "C3"
      - "C4"
      - "C5"

    decoder:
      name: "multiscale"
      width: 96

    # Same target/loss as B1 to isolate the architecture change.
    target: "density_map_raw"

    loss:
      name: "mse"


  M1-L:
    # Isolates the loss change relative to M1.
    # Loss ablation.
    model: "multiscale_resnet18"

    encoder:
      name: "ResNet18"
      pretrained: true

    features:
      - "C3"
      - "C4"
      - "C5"
      

    # Apply CC+KLD to the probability-map representation.
    target: "density_map_prob"

    decoder:
      name: "multiscale"
      width: 96

    loss:
      name: "cc_kld"

      # Weights selected on the tuning split.
      cc_weight: 0.5
      kld_weight: 0.5


  G:
    # Isolates the Adaptive Center Prior contribution.
    # Keep M1-L fixed so G isolates the adaptive prior.
    model: "adaptive_center_prior"

    base_model: "M1-L"
    center_prior: "B0"

    gate:
      hidden_dim: 64

    target: "density_map_prob"

    # Keep the same loss as the base model.
    loss:
      name: "cc_kld"
      cc_weight: 0.5
      kld_weight: 0.5


  M2:
    # Isolates the encoder change while keeping decoder and loss comparable.
    model: "hierarchical_transformer"

    encoder:
      name: "pvt_v2_b1"
      pretrained: true

    features:
      - "C3"
      - "C4"
      - "C5"

    decoder:
      name: "multiscale"
      width: 96

    target: "density_map_prob"

    # Same selected loss as M1-L.
    loss:
      name: "cc_kld"
      cc_weight: 0.5
      kld_weight: 0.5
