dataset_root: "data/"
manifest_path: "results/split_manifest.csv"  # directory where SALICON was downloaded
        
images_dir: "images"             # es. "data/images/train"
maps_dir: "maps"                # es. "data/maps/train"
fixations_dir: "fixations"           # null if unavailable 
has_fixation_coordinates: true  # true/false 

# Colab: copy/extract the dataset here local VM storage at session start.
colab_local_cache_dir: "/content/data_local"

# Aligned with official SALICON sizes 10K train / 5K val; Use one project-wide seed and save the manifest
# in results/split_manifest.csv.
seed: 42
n_train: 10000
n_tuning: 2500
n_internal_test: 2500

# Development subset
#Final runs for the table
# final runs use the full training set defined above.
dev_subset_n_train: 6000

# Preprocessing
input_size: [256, 192]   # [width, height] — reduced resolution for free Colab + M1
density_map_epsilon: 1.0e-6   # for normalization P = (P + eps) / sum(P + eps); stabilizes KLD/SIM
augmentation: "hflip_sync"    # Horizontal flip 
