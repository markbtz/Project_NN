# Configurazione degli esperimenti del progetto NNDL Saliency.
#
# data.yaml resta la source of truth per:
# - path del dataset
# - input_size
# - density_map_epsilon
# - seed
# - dimensioni degli split
#
# Questo file descrive invece training, architetture e loss.
#
# NOTA IMPORTANTE:
# cc_weight e kld_weight restano null finche' la loss combinata CC+KLD
# non viene implementata e selezionata sul tuning set. M1-L/G/M2 non
# devono essere lanciati finche' questi valori non vengono definiti.
#
# B1 mantiene AdamW, lr=1e-4, weight_decay=1e-4, batch_size=8, epochs=3.
# Il best checkpoint dei modelli trainabili viene selezionato sul tuning set
# con una regola comune definita da selection_metric / selection_mode.

training:
  train_split: "train"
  validation_split: "tuning"

  batch_size: 8
  epochs: 3
  num_workers: 0

  early_stopping:
    enabled: true
    patience: 5

  # Regola comune per scegliere il best checkpoint sul tuning set.
  # CC: piu' alto e' meglio.
  selection_metric: "cc"
  selection_mode: "max"

  optimizer:
    name: "AdamW"
    learning_rate: 1.0e-4
    weight_decay: 1.0e-4


experiments:

  B0:
    # isola: quanto vale il solo center bias
    # task slide: nessuno / baseline non trainabile
    model: "center_prior"
    trainable: false

    # B0 viene calcolato sulle mappe probabilistiche del training set.
    target: "density_map_prob"

    loss:
      name: null


  B1:
    # isola: baseline neurale di riferimento
    # task slide: Base
    model: "B1Baseline"

    encoder:
      name: "ResNet18"
      pretrained: true

    decoder:
      name: "single_bottleneck"
      width: 96

    # MSE deve essere calcolata sulla density map raw [0,1].
    target: "density_map_raw"

    loss:
      name: "mse"


  M1:
    # isola: effetto puro delle skip connection / feature multi-scala
    #          a parita' di loss con B1
    # task slide: Intermediate
    model: "multiscale_resnet18"

    encoder:
      name: "ResNet18"
      pretrained: true

    features:
      - "C3"
      - "C4"
      - "C5"

    decoder:
      name: "multiscale"
      width: 96

    # Stessa target/loss di B1 per isolare l'effetto architetturale.
    target: "density_map_raw"

    loss:
      name: "mse"


  M1-L:
    # isola: effetto puro del cambio di loss rispetto a M1
    # task slide: nessuno / ablation sulla loss
    model: "multiscale_resnet18"

    encoder:
      name: "ResNet18"
      pretrained: true

    features:
      - "C3"
      - "C4"
      - "C5"
      

    # La loss CC+KLD viene applicata alla rappresentazione probabilistica.
    target: "density_map_prob"

    loss:
      name: "cc_kld"

      # Da definire sul tuning set quando la loss combinata sara' implementata.
      cc_weight: null
      kld_weight: null


  G:
    # isola: contributo dell'Adaptive Center Prior
    # task slide: Originalita'
    #
    # Regola sperimentale:
    # usare M1-L come base se il cambio di loss viene confermato sul tuning set;
    # se M1-L non migliora M1, aggiornare base_model a "M1" prima del run di G.
    model: "adaptive_center_prior"

    base_model: "M1-L"
    center_prior: "B0"

    target: "density_map_prob"

    # Mantiene la stessa loss della base scelta.
    loss:
      name: "cc_kld"
      cc_weight: null
      kld_weight: null


  M2:
    # isola: effetto del cambio di encoder mantenendo il decoder/loss comparabili
    # task slide: Advanced
    model: "hierarchical_transformer"

    # Decisione finale ancora da prendere.
    # Il piano raccomanda un backbone gerarchico leggero
    # compatibile con feature multi-scala.
    backbone_family_candidates:
      - "Swin-Tiny"
      - "PVT-Tiny"

    decoder: "same_as_M1"

    target: "density_map_prob"

    # M2 mantiene la stessa loss di M1-L.
    loss:
      name: "cc_kld"
      cc_weight: null
      kld_weight: null