name: nndl-saliency
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - matplotlib
  - pandas
  - scikit-image
  - pyyaml
  - tqdm
  - pip:
      # Keep numpy here with torch/torchvision/opencv, NOT among the conda dependencies
      # above: this lets pip resolve all these versions together in a single
      # step, avoiding the numpy/torch mismatch observed in practice
      # (torch compiled against a NumPy ABI different from the one installed by conda).
      - numpy
      - torch
      - torchvision
      # on Apple Silicon, torch automatically uses the "mps" backend when available
      - timm            # lightweight pretrained backbones (ViT-Tiny/DeiT-Tiny for the Advanced task)
      - kaggle          # download dataset
      - opencv-python-headless
      - pytest
